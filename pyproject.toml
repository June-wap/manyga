[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "livegame-studio"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "pydantic-settings", "sqlalchemy>=2", "PySide6", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[tool.setuptools.packages.find]
include = ["core*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"
